name: Transfer LINE Secrets to Supabase

on:
  workflow_dispatch:

jobs:
  export-encrypted:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TRANSFER_PASSPHRASE: ${{ secrets.LINE_SECRET_TRANSFER_PASSPHRASE }}
        run: |
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          test -n "$LINE_USER_ID"
          test -n "$TRANSFER_PASSPHRASE"

      - name: Encrypt LINE secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TRANSFER_PASSPHRASE: ${{ secrets.LINE_SECRET_TRANSFER_PASSPHRASE }}
        run: |
          umask 077
          printf 'LINE_CHANNEL_ACCESS_TOKEN=%s\n' "$LINE_CHANNEL_ACCESS_TOKEN" > line-secrets.env
          printf 'LINE_USER_ID=%s\n' "$LINE_USER_ID" >> line-secrets.env
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in line-secrets.env \
            -out line-secrets.env.enc \
            -pass env:TRANSFER_PASSPHRASE
          shred -u line-secrets.env || rm -f line-secrets.env

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-secrets-encrypted
          path: line-secrets.env.enc
          retention-days: 1
