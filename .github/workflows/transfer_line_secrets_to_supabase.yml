name: Transfer LINE Secrets to Supabase

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEMP }}
        run: |
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          test -n "$LINE_USER_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Set Supabase Edge Function secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEMP }}
        run: |
          npx supabase@latest secrets set \
            LINE_CHANNEL_ACCESS_TOKEN="$LINE_CHANNEL_ACCESS_TOKEN" \
            LINE_USER_ID="$LINE_USER_ID" \
            --project-ref qscqemykkkarzsufudji
