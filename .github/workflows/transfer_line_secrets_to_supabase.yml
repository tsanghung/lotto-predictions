name: Transfer LINE Secrets to Supabase

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEMP }}
        run: |
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          test -n "$LINE_USER_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Set Supabase Edge Function secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_TEMP }}
        run: |
          umask 077
          printf 'LINE_CHANNEL_ACCESS_TOKEN=%s\n' "$LINE_CHANNEL_ACCESS_TOKEN" > edge-secrets.env
          printf 'LINE_USER_ID=%s\n' "$LINE_USER_ID" >> edge-secrets.env
          supabase secrets set --env-file edge-secrets.env --project-ref qscqemykkkarzsufudji
          rm -f edge-secrets.env
