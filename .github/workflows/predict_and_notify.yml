name: AI Prediction and Notify

on:
  # Production prediction and LINE notification scheduling has moved to Supabase Cron.
  # Keep this workflow as a manual fallback only.
  workflow_dispatch:
    inputs:
      game_type:
        description: '選擇要手動預測的遊戲'
        required: true
        default: '539'
        type: choice
        options:
          - '539'
          - '649'

jobs:
  predict-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily 539 Prediction
        if: github.event.inputs.game_type == '539'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PYTHONPATH: src
        run: |
          DAYOFWEEK=$(TZ=Asia/Taipei date +%u)
          if [ "$DAYOFWEEK" -eq 7 ]; then
            echo "週日今彩539不開獎，跳過。"
            exit 0
          fi
          python -m src.main_predict --game 539

      - name: Run Lotto 649 Prediction
        if: github.event.inputs.game_type == '649'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PYTHONPATH: src
        run: |
          DAYOFWEEK=$(TZ=Asia/Taipei date +%u)
          echo "Taiwan time day of week: $DAYOFWEEK ($(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M %Z'))"
          if [ "$DAYOFWEEK" -eq 2 ] || [ "$DAYOFWEEK" -eq 5 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python -m src.main_predict --game 649
          else
            echo "Today is not Tuesday or Friday, skipping Lotto 649."
          fi

      - name: Sync Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured. Skipping Supabase sync."
            exit 0
          fi
          python scripts/sync_supabase.py

      - name: Check for Changes and Commit Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain data/predictions.json data/predictions_archive.json)" ]; then
            echo "Predictions updated, committing..."
            git add data/predictions.json data/predictions_archive.json
            git commit -m "Auto-predict: AI generated new predictions"
            git pull --rebase origin main
            git push
          else
            echo "No new predictions to commit."
          fi
