name: Daily Lotto Data Update

on:
  # Production scheduling has moved to Supabase Cron.
  # Keep this workflow as a manual fallback only.
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Lotto Data
        env:
          PYTHONPATH: src
        run: |
          python -m src.scraper.update_latest

      - name: Sync with Official NTA API (Auto-Reconciliation)
        env:
          PYTHONPATH: src
        run: |
          python -m src.scraper.official_sync

      - name: Evaluate Predictions & Scientific Attribution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m src.analyzer.evaluator

      - name: Sync Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured. Skipping Supabase sync."
            exit 0
          fi
          python scripts/sync_supabase.py

      - name: Check for Changes and Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing updates..."
            git add data/*.json
            git commit -m "Auto-update: Sync with Official NTA API & Latest Results"
            git pull --rebase origin main
            git push
          else
            echo "No new data to commit."
          fi
