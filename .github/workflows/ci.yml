name: Legacy Python CI - Compile Check

on:
  push:
  pull_request:

jobs:
  compile-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile legacy Python files (syntax check only)
        run: |
          python -m compileall -q src || (echo "Syntax errors in Python files" && exit 1)
