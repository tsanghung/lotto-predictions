name: Deploy Frontend to GitHub Pages

on:
  # 當 main 分支的 frontend 或是 data 目錄有變動時觸發
  # 注意：由 github-actions[bot] (GITHUB_TOKEN) 推送的 commit 不會觸發此 push 事件，
  #       因此資料更新 / AI 預測完成後改由下方 workflow_run 串接觸發佈署。
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - 'data/**'
      - '.github/workflows/deploy_pages.yml'

  # 資料更新或 AI 預測完成後自動串接佈署
  # （解決 GITHUB_TOKEN 推送的 commit 不會觸發 push 事件的限制）
  workflow_run:
    workflows: ["Daily Lotto Data Update", "AI Prediction and Notify"]
    types: [completed]

  # 允許從 Actions 分頁手動觸發
  workflow_dispatch:

# 設定 GitHub Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時只有一個部署正在進行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run 觸發時，只在前置 workflow 成功後才佈署
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Copy Data Folder
        # 將專案根目錄的 data 資料夾複製到打包好的 dist 目錄內
        # 這樣前端頁面 fetch('/data/meta.json') 就能正確抓到檔案
        run: cp -r data frontend/dist/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
