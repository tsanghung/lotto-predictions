name: Keep Alive

# 防止 GitHub 因 repo 閒置而自動停用 scheduled workflows
# GitHub 政策：超過 60 天沒有 push activity 的 repo，排程會被暫停
# 此 workflow 每月 1 日自動 push 一次空 commit 來維持活躍狀態

on:
  schedule:
    # 每月 1 日 UTC 01:00（台灣時間 09:00）執行
    - cron: '0 1 1 * *'
  workflow_dispatch: # 允許手動觸發（用於測試或緊急恢復）

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Keep Alive Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 更新 keep-alive 時間戳記檔案
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive.txt
          git add .github/keep-alive.txt
          git commit -m "chore: keep-alive to prevent scheduled workflow suspension [skip ci]"
          git push
