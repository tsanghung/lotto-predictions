name: Transfer Gemini Secret to Supabase

on:
  workflow_dispatch:

jobs:
  export-encrypted:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSFER_PASSPHRASE: ${{ secrets.GEMINI_SECRET_TRANSFER_PASSPHRASE }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$TRANSFER_PASSPHRASE"

      - name: Encrypt Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSFER_PASSPHRASE: ${{ secrets.GEMINI_SECRET_TRANSFER_PASSPHRASE }}
        run: |
          umask 077
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > gemini-secret.env
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in gemini-secret.env \
            -out gemini-secret.env.enc \
            -pass env:TRANSFER_PASSPHRASE
          shred -u gemini-secret.env || rm -f gemini-secret.env

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-secret-encrypted
          path: gemini-secret.env.enc
          retention-days: 1
